<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Showcase</title>
    <style>
        /* General Styles */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f6f9;
            color: #333;
        }

        /* Dark Header */
        .header {
            background-color: #282c34;
            color: #fff;
            padding: 20px 0;
            text-align: center;
            font-size: 2.5em;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        /* Social Links (Positioned at top right) */
        .social-links-header {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }

        .social-links-header a {
            display: inline-block;
            width: 30px;
            height: 30px;
        }

        .social-links-header img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Certificate Container */
        .certificate-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            justify-content: center;
            max-width: 1000px;
            margin: 20px auto;
            padding: 10px;
        }

        /* Certificate Card Styles */
        .certificate-card {
            background: linear-gradient(135deg, #ffffff, #e3f2fd);
            border: 1px solid #b3e5fc;
            border-radius: 15px;
            padding: 30px;
            height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .certificate-card h3 {
            margin: 0;
            font-size: 1.6em;
            color: #00796b;
            font-weight: bold;
        }

        .certificate-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
        }

    </style>
</head>

<body>

    <!-- Dark Header -->
    <div class="header">
        Certificate Showcase
    </div>

    <header>
        <div class="social-links-header">
            <a href="https://www.linkedin.com/feed/" target="_blank" title="LinkedIn" aria-label="LinkedIn" class="linkedin">
                <img src="download.png" alt="LinkedIn">
            </a>
            <a href="https://github.com/Unnatidharsharma" target="_blank" title="GitHub" aria-label="GitHub" class="github">
                <!-- Make sure the path to GitHub logo is correct -->
                <img src="png-transparent-github-social-media-computer-icons-logo-android-github-logo-computer-wallpaper-banner-thumbnail.png" alt="GitHub"> <!-- Adjust path if needed -->
            </a>
        </div>
    </header>

    <!-- Certificate Display -->
    <div id="certificate-container" class="certificate-container">
        <!-- Predefined certificate cards -->
        <div class="certificate-card" onclick="openCertificate('Unnatidhar Sharma_certificate-2.pdf')">
            <h3>Machine Learning Certificate</h3>
        </div>
        <div class="certificate-card" onclick="openCertificate('UNNATIDHAR SHARMAcertificate (2).pdf')">
            <h3>Microsoft AI Certificate</h3>
        </div>
        <div class="certificate-card" onclick="openCertificate('Unnatidhar_Oct_2023_internship_41839 (1).pdf')">
            <h3>Artificial Intelligence Languify Certificate</h3>
        </div>
        <div class="certificate-card" onclick="openCertificate('DeepLearning.pdf')">
            <h3>Deep Learning Certificate</h3>
        </div>
    </div>

    <script>
        function openCertificate(filePath) {
            // Open the certificate in a new tab
            window.open(filePath, '_blank');
        }
    </script>

</body>

</html>
