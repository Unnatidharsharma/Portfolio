<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills Showcase</title>
    <style>
        /* Existing CSS */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #e0e0e0;
            color: #333;
            text-align: center;
            transition: background-color 0.3s, color 0.3s;
        }

        body.night-mode {
            background-color: #121212;
            color: #e0e0e0;
        }

        header {
            background-color: #444;
            color: #fff;
            padding: 10px 20px;
            margin-bottom: 20px;
            position: relative;
            transition: background-color 0.3s;
        }

        header.night-mode {
            background-color: #333;
        }

        section {
            padding: 20px;
        }

        .skills {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 45px;
            justify-content: center;
        }

        .skill-item {
            background: linear-gradient(145deg, #ffffff, #f0f0f0);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            width: 150px;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            position: relative;
            border: 2px solid #007bff;
        }

        .skill-item.night-mode {
            background: linear-gradient(145deg, #2e2e2e, #1e1e1e);
            color: #e0e0e0;
            border: 2px solid #1a73e8;
        }

        .skill-item:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }

        .add-skill {
            font-size: 20px;
            cursor: pointer;
            color: #fff;
            background-color: #007bff;
            border-radius: 120%;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            position: absolute;
            top: 600px;
            right: 20px;
        }

        .add-skill.night-mode {
            background-color: #1a73e8;
        }

        .add-skill:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            transition: background-color 0.3s;
        }

        .modal.night-mode {
            background-color: rgba(0, 0, 0, 0.9);
        }

        .modal-content {
            background-color: #fff;
            margin: 10% auto;
            padding: 20px;
            border-radius: 8px;
            width: 80%;
            max-width: 600px;
            text-align: left;
            transition: background-color 0.3s, color 0.3s;
        }

        .modal-content.night-mode {
            background-color: #2e2e2e;
            color: #e0e0e0;
        }

        .close-btn {
            float: right;
            font-size: 24px;
            cursor: pointer;
        }

        .input-field {
            margin: 10px 0;
            padding: 8px;
            width: 100%;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            transition: border-color 0.3s, background-color 0.3s;
        }

        .input-field.night-mode {
            border-color: #555;
            background-color: #333;
            color: #e0e0e0;
        }

        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button.night-mode {
            background-color: #1a73e8;
        }

        button:hover {
            background-color: #0056b3;
        }

        .context-menu {
            display: none;
            position: absolute;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            transition: background-color 0.3s;
        }

        .context-menu.night-mode {
            background-color: #333;
            color: #e0e0e0;
        }

        .context-menu-item {
            padding: 10px 15px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .context-menu-item:hover {
            background-color: #f0f0f0;
        }

        .night-mode-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 20px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .night-mode-btn.night-mode {
            background-color: #1a73e8;
        }

        .night-mode-btn:hover {
            background-color: #0056b3;
        }

        .password-modal {
            display: none;
            position: fixed;
            z-index: 2;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            align-items: center;
            justify-content: center;
        }

        .password-modal-content {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            width: 300px;
            text-align: center;
        }

        .password-modal-content.night-mode {
            background-color: #2e2e2e;
            color: #e0e0e0;
        }

        .error-message {
            color: red;
        }
    </style>
</head>
<body>
    <header>
        <h1>My Skills</h1>
        <button class="night-mode-btn" onclick="toggleNightMode()">&#9790;</button>
    </header>

    <section class="skills" id="skillsContainer">
        <!-- Permanent Skills -->
        <!-- Plus button to add new skills -->
        <div class="add-skill" onclick="openAddSkillModal()">+</div>
    </section>

    <!-- Add/Edit Skill Modal -->
    <div id="addSkillModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeAddSkillModal()">&times;</span>
            <h2 id="addEditSkillTitle">Add New Skill</h2>
            <input type="text" id="newSkillName" class="input-field" placeholder="Skill Name">
            <input type="text" id="newSkillDescription" class="input-field" placeholder="Skill Description">
            <button id="saveSkillButton" onclick="addSkill()">Add Skill</button>
        </div>
    </div>

    <!-- Context Menu -->
    <div id="contextMenu" class="context-menu">
        <div class="context-menu-item" onclick="confirmEditSkill()">Edit</div>
        <div class="context-menu-item" onclick="confirmDeleteSkill()">Delete</div>
    </div>

    <!-- Skill Details Modal -->
    <div id="skillModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeSkillModal()">&times;</span>
            <h2 id="modalSkillTitle"></h2>
            <p id="modalSkillDescription"></p>
            <a id="modalSkillLink" class="skill-link" href="" target="_blank">Learn More</a>
        </div>
    </div>

    <!-- Password Modal -->
    <div id="passwordModal" class="password-modal">
        <div class="password-modal-content">
            <h2>Enter Password</h2>
            <input type="password" id="passwordInput" class="input-field" placeholder="Password">
            <button onclick="verifyPassword()">Submit</button>
            <p id="passwordError" class="error-message"></p>
        </div>
    </div>

    <script>
        let skillToDelete = null;
        let skillToEdit = null;
        const nightModeClass = "night-mode";

        document.addEventListener("DOMContentLoaded", function() {
            applySavedTheme();
            loadStoredSkills();
        });

        function openAddSkillModal() {
            document.getElementById("addSkillModal").style.display = "block";
        }

        function closeAddSkillModal() {
            document.getElementById("addSkillModal").style.display = "none";
        }

        function toggleNightMode() {
            document.body.classList.toggle(nightModeClass);
            const elementsToToggle = document.querySelectorAll(".modal-content, .add-skill, .skill-item, .context-menu-item, .input-field, .night-mode-btn, header");
            elementsToToggle.forEach(element => element.classList.toggle(nightModeClass));

            const nightModeEnabled = document.body.classList.contains(nightModeClass);
            localStorage.setItem("nightModeEnabled", nightModeEnabled);
        }

        function applySavedTheme() {
            const nightModeEnabled = localStorage.getItem("nightModeEnabled") === "true";
            if (nightModeEnabled) {
                toggleNightMode();
            }
        }

        function loadStoredSkills() {
            const storedSkills = JSON.parse(localStorage.getItem("skills")) || [];
            const skillsContainer = document.getElementById("skillsContainer");
            storedSkills.forEach(skill => {
                addSkillToUI(skill.name, skill.description);
            });
        }

        function addSkill() {
            const name = document.getElementById("newSkillName").value;
            const description = document.getElementById("newSkillDescription").value;
            if (!name || !description) {
                alert("Please enter both a skill name and description.");
                return;
            }

            addSkillToUI(name, description);
            saveSkill(name, description);

            document.getElementById("newSkillName").value = "";
            document.getElementById("newSkillDescription").value = "";
            closeAddSkillModal();
        }

        function addSkillToUI(name, description) {
            const skillItem = document.createElement("div");
            skillItem.classList.add("skill-item");
            skillItem.innerHTML = `
                <div class="skill-name">${name}</div>
            `;
            skillItem.addEventListener("contextmenu", function(e) {
                e.preventDefault();
                skillToDelete = skillItem;
                openContextMenu(e);
            });
            skillItem.addEventListener("click", function() {
                showSkillDetails(name, description);
            });

            document.getElementById("skillsContainer").appendChild(skillItem);
        }

        function saveSkill(name, description) {
            const storedSkills = JSON.parse(localStorage.getItem("skills")) || [];
            storedSkills.push({ name, description });
            localStorage.setItem("skills", JSON.stringify(storedSkills));
        }

        function showSkillDetails(name, description) {
            document.getElementById("modalSkillTitle").innerText = name;
            document.getElementById("modalSkillDescription").innerText = description;
            document.getElementById("skillModal").style.display = "block";
        }

        function closeSkillModal() {
            document.getElementById("skillModal").style.display = "none";
        }

        function openContextMenu(event) {
            const contextMenu = document.getElementById("contextMenu");
            contextMenu.style.display = "block";
            contextMenu.style.left = `${event.pageX}px`;
            contextMenu.style.top = `${event.pageY}px`;
        }

        function closeContextMenu() {
            document.getElementById("contextMenu").style.display = "none";
        }

        window.addEventListener("click", function() {
            closeContextMenu();
        });

        function confirmEditSkill() {
            skillToEdit = skillToDelete;
            openPasswordModal('edit');
        }

        function confirmDeleteSkill() {
            openPasswordModal('delete');
        }

        function openPasswordModal(action) {
            document.getElementById("passwordModal").style.display = "flex";
            document.getElementById("passwordInput").setAttribute("data-action", action);
        }

        function closePasswordModal() {
            document.getElementById("passwordModal").style.display = "none";
            document.getElementById("passwordError").textContent = '';
        }

        function verifyPassword() {
            const password = document.getElementById("passwordInput").value;
            const action = document.getElementById("passwordInput").getAttribute("data-action");
            const correctPassword = "yourpassword"; // Replace with your actual password

            if (password === correctPassword) {
                if (action === 'delete' && skillToDelete) {
                    deleteSkill();
                } else if (action === 'edit') {
                    openEditSkillModal();
                }
                closePasswordModal();
            } else {
                document.getElementById("passwordError").textContent = 'Incorrect password. Please try again.';
            }
        }

        function openEditSkillModal() {
            // Logic to open the edit modal (to be implemented)
        }

        function deleteSkill() {
            if (skillToDelete) {
                skillToDelete.remove();
                const storedSkills = JSON.parse(localStorage.getItem("skills")) || [];
                const updatedSkills = storedSkills.filter(skill => skill.name !== skillToDelete.querySelector(".skill-name").textContent);
                localStorage.setItem("skills", JSON.stringify(updatedSkills));
            }
            closeContextMenu();
        }
    </script>
</body>
</html>
