<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume Viewer</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f4f4f9;
      font-family: Arial, sans-serif;
    }
    iframe {
      width: 100%;
      height: 100vh;
      border: none;
    }
    .change-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 60px;
      height: 60px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 50%;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .change-btn:hover {
      background-color: #45a049;
    }
    #changeResumeForm {
      display: none;
      position: fixed;
      bottom: 100px;
      right: 20px;
      background: white;
      padding: 1rem;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      width: 300px;
    }
    #changeResumeForm input[type="password"],
    #changeResumeForm input[type="file"] {
      width: 100%;
      padding: 6px;
      margin: 10px 0;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    #changeResumeForm button {
      padding: 10px;
      font-size: 14px;
      color: white;
      background-color: #e74c3c;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
    }
    #changeResumeForm button:hover {
      background-color: #c0392b;
    }
    #closeForm {
      display: block;
      text-align: right;
      font-size: 18px;
      color: #e74c3c;
      cursor: pointer;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <!-- Full Resume Display -->
  <iframe src="Unnatidhar_Sharma_Resume (2).pdf" id="resumeViewer"></iframe>

  <!-- Change Resume Button -->
  <button class="change-btn" id="changeBtn">⚙️</button>

  <!-- Change Resume Form -->
  <form id="changeResumeForm">
    <span id="closeForm">&times;</span>
    <input type="password" id="adminPassword" placeholder="Enter Admin Password" required>
    <input type="file" id="newResume" accept=".pdf" required>
    <button type="submit">Upload New Resume</button>
  </form>

  <script>
    // Admin Password
    const adminPassword = "Uwtf2064@"; // Set your secure password here

    // Elements
    const changeBtn = document.getElementById("changeBtn");
    const changeResumeForm = document.getElementById("changeResumeForm");
    const closeForm = document.getElementById("closeForm");
    const adminPasswordInput = document.getElementById("adminPassword");
    const newResumeInput = document.getElementById("newResume");
    const resumeViewer = document.getElementById("resumeViewer");

    // Show the form when the button is clicked
    changeBtn.addEventListener("click", () => {
      changeResumeForm.style.display = "block";
    });

    // Close the form and clear inputs
    closeForm.addEventListener("click", () => {
      changeResumeForm.style.display = "none";
      changeResumeForm.reset(); // Clear all form inputs
    });

    // Handle form submission
    changeResumeForm.addEventListener("submit", (e) => {
      e.preventDefault();

      const enteredPassword = adminPasswordInput.value;

      // Check if the password is correct
      if (enteredPassword === adminPassword) {
        const newResumeFile = newResumeInput.files[0];

        if (newResumeFile && newResumeFile.type === "application/pdf") {
          const newResumeURL = URL.createObjectURL(newResumeFile);

          // Update the PDF viewer with the new resume
          resumeViewer.src = newResumeURL;

          alert("Resume updated successfully!");

          // Reset and hide the form
          changeResumeForm.reset();
          changeResumeForm.style.display = "none";
        } else {
          alert("Please upload a valid PDF file.");
        }
      } else {
        alert("Incorrect password. Access denied.");
      }
    });
  </script>
</body>
</html>
