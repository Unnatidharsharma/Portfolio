<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Skills</title>
    <style>
        /* General Styles */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f6f9;
            color: #333;
        }

        /* Dark Header */
        .header {
            background-color: #282c34; /* Dark color */
            color: #fff;
            padding: 20px 0;
            text-align: center;
            font-size: 2.5em;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        /* Skills Container */
        .skills-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            justify-content: center;
            max-width: 900px;
            margin: 20px auto;
            padding: 10px;
        }

        /* Skill Card Styles */
        .skill-card {
            background: linear-gradient(135deg, #ffffff, #e3f2fd);
            border: 1px solid #b3e5fc;
            border-radius: 15px;
            padding: 20px;
            height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .skill-card h3 {
            margin: 0;
            font-size: 1.4em;
            color: #00796b;
            font-weight: bold;
        }

        .skill-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
        }

        /* Responsive Adjustments */
        @media (max-width: 600px) {
            .header {
                font-size: 1.8em;
            }

            .skill-card h3 {
                font-size: 1.2em;
            }
        }

    </style>
</head>
<body>

    <!-- Dark Header -->
    <div class="header">
        My Skills
    </div>

    <!-- Skills Display -->
    <div id="skills-container" class="skills-container"></div>

    <script>
        // Skills Added Directly in the Code
        let skills = ["Machine Learning", "Data Science", "SQL", "Deep Learning", "Python"];

        const skillsContainer = document.getElementById("skills-container");

        function renderSkills() {
            skillsContainer.innerHTML = "";
            skills.forEach((skill) => {
                const card = document.createElement("div");
                card.className = "skill-card";
                card.innerHTML = `<h3>${skill}</h3>`;
                skillsContainer.appendChild(card);
            });
        }

        renderSkills();
    </script>
</body>
</html>
