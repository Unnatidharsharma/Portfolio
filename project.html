<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Showcase</title>
    <style>
        /* General Styles */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f6f9;
            color: #333;
        }

        /* Dark Header */
        .header {
            background-color: #282c34;
            color: #fff;
            padding: 20px 0;
            text-align: center;
            font-size: 2.5em;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        /* Social Links (Positioned at top right) */
        .social-links-header {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }

        .social-links-header a {
            display: inline-block;
            width: 30px;
            height: 30px;
        }

        .social-links-header img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Projects Container */
        .projects-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); /* Increased min-width */
            gap: 20px;
            justify-content: center;
            max-width: 1000px; /* Increased max-width */
            margin: 20px auto;
            padding: 10px;
        }

        /* Project Card Styles */
        .project-card {
            background: linear-gradient(135deg, #ffffff, #e3f2fd);
            border: 1px solid #b3e5fc;
            border-radius: 15px;
            padding: 30px; /* Increased padding */
            height: 180px; /* Increased height */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .project-card h3 {
            margin: 0;
            font-size: 1.6em; /* Increased font size */
            color: #00796b;
            font-weight: bold;
        }

        .project-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
        }

        .modal-content {
            background-color: #ffffff;
            margin: 100px auto;
            padding: 20px;
            border: 1px solid #ccc;
            width: 80%;
            max-width: 500px;
            text-align: left;
            border-radius: 8px;
            position: relative;
        }

        .modal-content h2 {
            margin: 0 0 20px;
            font-size: 22px;
        }

        .modal-content p {
            font-size: 16px;
            color: #333;
            margin-bottom: 10px;
        }

        .close-btn {
            position: absolute;
            right: 15px;
            top: 15px;
            font-size: 24px;
            cursor: pointer;
            color: #ff5252;
            transition: color 0.3s;
        }

        .close-btn:hover {
            color: #ff1744;
        }
        
    </style>
</head>

<body>

    <!-- Dark Header -->
    <div class="header">
        Project Showcase
    </div>

    <header>
        <div class="social-links-header">
            <a href="https://www.linkedin.com/feed/" target="_blank" title="LinkedIn" aria-label="LinkedIn" class="linkedin">
                <img src="download.png" alt="LinkedIn">
            </a>
            <a href="https://github.com/Unnatidharsharma" target="_blank" title="GitHub" aria-label="GitHub" class="github">
                <img src="png-transparent-github-social-media-computer-icons-logo-android-github-logo-computer-wallpaper-banner-thumbnail.png" alt="GitHub">
            </a>
        </div>
    </header>

    <!-- Projects Display -->
    <div id="projects-container" class="projects-container">
        <!-- Predefined project cards -->
        <div class="project-card" onclick="showProjectDetails('DeepFake Detection', 'A deepfake detection system that uses CNN to analyze and detect manipulated videos. Technology: CNN, TensorFlow, Deep Learning.')">
            <h3>DeepFake Detection</h3>
        </div>
        <div class="project-card" onclick="showProjectDetails('WhatsApp Sentiment Analysis', 'This project analyzes sentiment in WhatsApp conversations using NLP techniques to classify messages as positive, negative, or neutral. Technology: NLP, Python, TextBlob.')">
            <h3>WhatsApp Sentiment Analysis</h3>
        </div>
        <div class="project-card" onclick="showProjectDetails('Movie Recommendation System', 'A recommendation system that suggests movies based on user preferences and previous ratings. Technology: Machine Learning, Collaborative Filtering.')">
            <h3>Movie Recommendation System</h3>
        </div>
        <div class="project-card" onclick="showProjectDetails('Fruit and Food Detection', 'A deep learning model that detects and classifies different types of fruits and foods using image recognition. Technology: CNN, OpenCV, TensorFlow.')">
            <h3>Fruit and Food Detection</h3>
        </div>
    </div>

    <!-- Modal for project details -->
    <div id="projectModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeProjectDetails()">&times;</span>
            <h2 id="projectTitle">Project Title</h2>
            <p id="projectDescription">Project description goes here.</p>
        </div>
    </div>

    <script>
        function showProjectDetails(title, description) {
            // Set the project title and description in the modal
            document.getElementById('projectTitle').textContent = title;
            document.getElementById('projectDescription').textContent = description;
            // Show the modal
            document.getElementById('projectModal').style.display = 'block';
        }

        function closeProjectDetails() {
            // Close the modal
            document.getElementById('projectModal').style.display = 'none';
        }
    </script>

</body>

</html>
